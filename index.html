<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Cyber Runner - Enhanced Prototype</title>
  <link rel="stylesheet" href="style.css">
  <!--
    Cara menjalankan:
    - Simpan ketiga file: index.html, style.css, game.js (di folder yang sama)
    - Buka index.html di browser (mobile/desktop)
    - Ubah VIEW_MODE dan DEBUG di game.js jika perlu
  -->
</head>
<body>
  <canvas id="gameCanvas" aria-hidden="true"></canvas>

  <!-- Transparent touch zones (accept input but invisible) -->
  <div id="touch-left" class="touch-zone" aria-hidden="true"></div>
  <div id="touch-right" class="touch-zone" aria-hidden="true"></div>
  <div id="touch-bottom" class="touch-zone" aria-hidden="true"></div>

  <!-- UI overlay (neon panel) -->
  <div id="ui-overlay" aria-hidden="false">
    <div id="ui-left">
      <div id="score" class="ui-pill">Score: 0</div>
      <div id="coins" class="ui-pill">Best: 0</div>
    </div>
    <div id="ui-center">
      <button id="btn-restart" class="ui-btn">Restart</button>
      <button id="btn-pause" class="ui-btn">Pause</button>
    </div>
    <div id="ui-right">
      <div id="status" class="ui-pill">RUN</div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
