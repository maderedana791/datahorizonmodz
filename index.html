<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Cyber Runner - Prototype</title>
  <link rel="stylesheet" href="style.css">
  <!--
    Cara menjalankan:
    - Simpan file ini sebagai index.html, dan letakkan bersama game.js + style.css
    - Buka index.html di browser (mobile atau desktop)
    - Ubah VIEW_MODE dan DEBUG di game.js jika perlu
  -->
</head>
<body>
  <!-- Canvas mengisi layar -->
  <canvas id="gameCanvas"></canvas>

  <!-- Invisible / transparent touch zones (diposisikan dan diatur via CSS) -->
  <div id="touch-left" class="touch-zone" aria-hidden="true"></div>
  <div id="touch-right" class="touch-zone" aria-hidden="true"></div>
  <div id="touch-bottom" class="touch-zone" aria-hidden="true"></div>

  <!-- Minimal onscreen buttons (visible only di VIEW_MODE = "full") -->
  <div id="ui-overlay">
    <div id="score">0</div>
    <div id="coins">0</div>
    <button id="btn-restart">Restart</button>
    <button id="btn-pause">Pause</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
